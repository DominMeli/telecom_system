<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telecom - Servicios y reparación de PC</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <h1>Telecom</h1>
    <p>Servicios y reparación de PC</p>
  </header>

  <main>
    <section id="servicios">
      <h2>Servicios</h2>
      <ul>
        <li>Formateo e instalación de Windows</li>
        <li>Limpieza y mantenimiento preventivo</li>
        <li>Cambio de pantalla, disco o memoria</li>
        <li>Redes y cableado</li>
      </ul>
    </section>

    <section id="cotizador">
      <h2>Cotizador</h2>
      <label for="servicio">Elige un servicio:</label>
      <select id="servicio">
        <option value="40">Formateo e instalación</option>
        <option value="30">Mantenimiento preventivo</option>
        <option value="80">Cambio de componente</option>
        <option value="60">Redes y cableado</option>
      </select>
      <button id="btnCotizar">Cotizar</button>
      <p id="resultado"></p>
    </section>
  </main>

  <footer>
    <p>Telecom &copy; 2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
